<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Hi 💕</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: -apple-system, 'Segoe UI', Verdana, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    max-width: 340px;
    width: 90%;
    animation: pop 0.5s ease;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pic {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    border: 5px solid #ff6b81;
    animation: float 3s ease-in-out infinite;
    /* To use your own photo, replace the div below with:
       <img src="your-photo.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
    */
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  h1 {
    color: #d6336c;
    font-size: 28px;
    margin: 10px 0;
    animation: wiggle 1.2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }
  p.hint {
    color: #aaa;
    font-size: 13px;
    margin-top: 20px;
  }
  .kiss {
    font-size: 50px;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  .hearts span {
    position: fixed;
    font-size: 20px;
    animation: rise 4s linear forwards;
    opacity: 0.8;
  }
  @keyframes rise {
    to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card" id="card" onclick="next()">
  <div class="pic" id="pic">💑</div>
  <h1 id="text">Hi 👋</h1>
  <p class="hint" id="hint">(tap me)</p>
</div>

<div class="hearts" id="hearts"></div>

<script>
  let stage = 0;
  const messages = [
    "Hi 👋",
    "What up baby? 😏",
    "Miss me? Okay bbye 😘"
  ];
  const pics = ["💑", "😘", "💋"];

  function spawnHearts() {
    const container = document.getElementById('hearts');
    for (let i = 0; i < 8; i++) {
      const h = document.createElement('span');
      h.textContent = ["💖","💕","❤️","💗"][Math.floor(Math.random()*4)];
      h.style.left = Math.random() * 100 + "vw";
      h.style.bottom = "-20px";
      h.style.animationDelay = (Math.random() * 0.5) + "s";
      container.appendChild(h);
      setTimeout(() => h.remove(), 4500);
    }
  }

  function next() {
    stage++;
    spawnHearts();
    const card = document.getElementById('card');
    const text = document.getElementById('text');
    const pic = document.getElementById('pic');
    const hint = document.getElementById('hint');

    if (stage >= messages.length) {
      text.textContent = messages[messages.length - 1];
      pic.innerHTML = '<span class="kiss">😘</span>';
      hint.textContent = "";
      card.onclick = null;
      card.style.cursor = "default";
      return;
    }

    text.textContent = messages[stage];
    pic.textContent = pics[stage];
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = 'pop 0.5s ease';

    if (stage === messages.length - 1) {
      hint.textContent = "";
    }
  }
</script>

</body>
</html>
